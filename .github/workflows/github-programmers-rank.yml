name: github-programmers-rank

on:
  push:
    branches: ["master"]
  schedule:
    - cron: "0 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Fetch Programmers record and update SVG
        env:
          PROGRAMMERS_TOKEN_ID: ${{ secrets.PROGRAMMERS_TOKEN_ID }}
          PROGRAMMERS_TOKEN_PW: ${{ secrets.PROGRAMMERS_TOKEN_PW }}
        run: |
          printf 'PROGRAMMERS_TOKEN_ID=%s\n' "$PROGRAMMERS_TOKEN_ID" > .env
          printf 'PROGRAMMERS_TOKEN_PW=%s\n' "$PROGRAMMERS_TOKEN_PW" >> .env
          npm run start
